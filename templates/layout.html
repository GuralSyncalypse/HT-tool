<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao diện Quản lý</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
        }
        button:disabled { cursor: not-allowed; opacity: 0.75; }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body class="bg-[#f8fafc] flex min-h-screen">
    
    <aside class="w-64 bg-white border-r border-gray-100 flex flex-col justify-between p-4 fixed h-full z-10">
        <div>
            <div class="flex items-center space-x-3 px-3 py-4 mb-6">
                <div class="w-8 h-8 bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold shadow-xs">
                    <i class="fa-solid fa-cube text-sm"></i>
                </div>
                <span class="font-bold text-gray-800 text-base tracking-wide">Dashboard</span>
            </div>

            <nav class="space-y-1">
                <a href="/" class="flex items-center space-x-3 px-4 py-3 text-sm {% if request.url.path == '/' %}font-bold text-blue-600 bg-blue-50/60{% else %}font-semibold text-gray-500 hover:text-blue-600 hover:bg-gray-50{% endif %} rounded-xl transition group">
                    <i class="fa-solid fa-pen-to-square text-base"></i>
                    <span>Đăng bài</span>
                </a>
                
                <a href="/messaging" class="flex items-center space-x-3 px-4 py-3 text-sm {% if request.url.path == '/messaging' %}font-bold text-blue-600 bg-blue-50/60{% else %}font-semibold text-gray-500 hover:text-blue-600 hover:bg-gray-50{% endif %} rounded-xl transition group">
                    <i class="fa-solid fa-paper-plane text-base {% if request.url.path == '/messaging' %}text-blue-600{% else %}text-gray-400 group-hover:text-blue-600{% endif %}"></i>
                    <span>Gửi tin nhắn</span>
                </a>
            </nav>
        </div>

        <div class="px-4 py-2 text-[11px] text-gray-400 font-medium italic">
            v1.0.0 (2026)
        </div>
    </aside>

    <main class="flex-1 ml-64 p-6 flex justify-center">
        <div class="w-full max-w-7xl flex flex-col">
            
            <div class="flex items-center justify-end space-x-3 mb-4 w-full">
                <div id="auth-guest-zone" class="flex space-x-2">
                    <a href="/login" class="text-xs font-bold text-gray-600 hover:text-blue-600 px-3 py-1.5 rounded-lg border border-gray-200 bg-white transition">
                        <i class="fa-solid fa-right-to-bracket mr-1"></i> Đăng nhập
                    </a>
                    <a href="/register" class="text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 px-3 py-1.5 rounded-lg transition shadow-xs">
                        <i class="fa-solid fa-user-plus mr-1"></i> Đăng ký
                    </a>
                </div>

                <div id="auth-user-zone" class="hidden flex items-center space-x-3">
                    <span class="text-xs font-semibold text-gray-700">
                        Xin chào, <span id="user-display-name" class="font-bold text-blue-600">...</span>
                    </span>
                    <button id="btn-logout-ui" class="text-xs font-bold text-red-600 hover:bg-red-50 px-3 py-1.5 rounded-lg border border-red-200 transition cursor-pointer">
                        <i class="fa-solid fa-power-off mr-1"></i> Đăng xuất
                    </button>
                </div>
            </div>

            {% block content %}{% endblock %}

        </div>
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
